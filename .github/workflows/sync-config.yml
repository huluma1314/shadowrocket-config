name: sync-config

on:
  schedule:
    # 每天北京时间 8:00 (UTC+8 = UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 手动触发
  push:
    paths:
      - '.github/workflows/sync-config.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch upstream lazy config
        run: |
          curl -sL -o /tmp/lazy_group.conf \
            'https://lowertop.github.io/Shadowrocket/lazy_group.conf' \
            --max-time 30
          echo "=== upstream file size: $(wc -c < /tmp/lazy_group.conf) ==="

      - name: Build config
        run: |
          python3 << 'SCRIPT'
          import re, os, datetime

          # Read current config
          with open('lazy_group_slim.conf', 'r') as f:
              current = f.read()

          # Check blackmatrix7 repo for new rule sets
          # The RULE-SET references auto-update via Shadowrocket's own fetch,
          # so we just verify the config is valid and stamp the date.
          
          today = datetime.datetime.utcnow().strftime('%Y-%m-%d')

          # Update the timestamp line if it exists
          lines = current.split('\n')
          for i, line in enumerate(lines):
              if line.startswith('# 最后同步'):
                  lines[i] = f'# 最后同步: {today}'
                  break
          else:
              # Add timestamp after the description header
              lines.insert(3, f'# 最后同步: {today}')

          updated = '\n'.join(lines)

          with open('lazy_group_slim.conf', 'w') as f:
              f.write(updated)

          print(f'Config updated at {today}')
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lazy_group_slim.conf
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync config $(date +%Y-%m-%d)"
            git push
          fi